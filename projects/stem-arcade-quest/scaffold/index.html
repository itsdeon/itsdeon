<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STEM Arcade Quest: Retro Learning Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0d1117; color: #58a6ff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    #hud { width: 640px; display: flex; justify-content: space-between; padding: 8px 16px; background: #161b22; border: 2px solid #30363d; border-bottom: none; font-size: 16px; font-weight: bold; }
    canvas { border: 2px solid #30363d; background: #000; box-shadow: 0 0 24px rgba(88, 166, 255, 0.2); image-rendering: pixelated; }
    #stem-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 480px; background: #161b22; border: 3px solid #f0883e; padding: 24px; box-shadow: 0 0 32px rgba(240, 136, 62, 0.5); z-index: 10; border-radius: 8px; }
    #modal-title { color: #f0883e; font-size: 20px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    #modal-question { font-size: 16px; color: #c9d1d9; margin-bottom: 16px; line-height: 1.4; }
    .option-btn { display: block; width: 100%; padding: 10px; margin: 8px 0; background: #21262d; color: #58a6ff; border: 1px solid #30363d; border-radius: 4px; cursor: pointer; font-size: 14px; text-align: left; transition: all 0.2s; }
    .option-btn:hover { background: #30363d; color: #ffffff; border-color: #58a6ff; }
  </style>
</head>
<body>
  <div id="hud">
    <span>SCORE: <span id="score-val">00000</span></span>
    <span>ZONE: <span id="zone-val">1 (MAZE)</span></span>
    <span>ENERGY: <span id="lives-val">3</span></span>
  </div>
  <canvas id="game-canvas" width="640" height="640"></canvas>
  <div id="stem-modal">
    <h2 id="modal-title">STEM Checkpoint</h2>
    <div id="modal-question">Question Text</div>
    <div id="modal-options"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
